<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="SPARK 2026 Admin Dashboard"
    >

    <meta
        name="theme-color"
        content="#071a33"
    >

    <title>SPARK 2026 | Admin Dashboard</title>


    <!-- =====================================================
         GOOGLE FONTS
         ===================================================== -->

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700;800&display=swap"
        rel="stylesheet"
    >


    <!-- =====================================================
         ADMIN DASHBOARD CSS
         ===================================================== -->

    <link
        rel="stylesheet"
        href="admin-dashboard.css"
    >

</head>


<body>

    <!-- =====================================================
         HEADER
         ===================================================== -->

    <header class="dashboard-header">

        <div class="header-inner">


            <!-- BRAND -->

            <div class="dashboard-brand">

                <img
                    src="images/sathyabama-logo.png"
                    alt="Sathyabama Institute of Science and Technology"
                    class="brand-logo"
                >

                <div class="brand-text">

                    <h1>
                        SPARK 2026
                    </h1>

                    <p>
                        Administrator Dashboard
                    </p>

                </div>

            </div>


            <!-- ADMIN AREA -->

            <div class="admin-area">

                <div class="admin-user">

                    <div class="admin-icon">
                        👤
                    </div>

                    <div>

                        <small>
                            Logged in as
                        </small>

                        <strong id="adminUsername">
                            Administrator
                        </strong>

                    </div>

                </div>


                <button
                    type="button"
                    id="logoutButton"
                    class="logout-button"
                >
                    Logout
                </button>

            </div>

        </div>

    </header>


    <!-- =====================================================
         MAIN DASHBOARD
         ===================================================== -->

    <main class="dashboard-main">


        <!-- =================================================
             PAGE HEADING
             ================================================= -->

        <section class="page-heading">

            <div>

                <div class="eyebrow">
                    SPARK 2026 · ADMINISTRATION
                </div>

                <h2>
                    Registration Verification
                </h2>

                <p>
                    Review and verify participant registrations
                    after successful payment.
                </p>

            </div>


            <!-- PENDING COUNT -->

            <div class="pending-stat">

                <span class="pending-stat-label">
                    Pending Verification
                </span>

                <span
                    id="pendingCount"
                    class="pending-stat-number"
                >
                    0
                </span>

            </div>

        </section>


        <!-- =================================================
             STATUS MESSAGE
             ================================================= -->

        <div
            id="dashboardMessage"
            class="dashboard-message"
            role="status"
            aria-live="polite"
        >
            Checking administrator session...
        </div>


<!-- =================================================
     TOOLBAR
     ================================================= -->

<div class="dashboard-toolbar">


    <!-- REFRESH -->

    <button
        type="button"
        id="refreshButton"
        class="refresh-button"
    >
        ↻ Refresh
    </button>


    <!-- =================================================
         TRANSACTION ID SEARCH
         ================================================= -->

    <div class="transaction-search">

        <input
            type="text"
            id="transactionSearchInput"
            class="transaction-search-input"
            placeholder="Enter 16-digit Transaction ID"
            inputmode="numeric"
            maxlength="16"
            autocomplete="off"
        >

        <button
            type="button"
            id="transactionSearchButton"
            class="transaction-search-button"
        >
            🔎 Search
        </button>

    </div>


    <!-- =================================================
         EXCEL EXPORT
         ================================================= -->

    <button
        type="button"
        id="exportExcelButton"
        class="export-button"
    >
        📥 Export Excel
    </button>


</div>

        <!-- =================================================
             REGISTRATIONS
             ================================================= -->

        <section
            id="registrationsContainer"
            aria-label="Pending registrations"
        >

            <!--
                JavaScript dynamically inserts
                registration cards here.
            -->

        </section>


    </main>


    <!-- =====================================================
         DETAILS MODAL
         ===================================================== -->

    <div
        id="detailsModal"
        class="modal hidden"
        role="dialog"
        aria-modal="true"
        aria-labelledby="modalTitle"
    >

        <div class="modal-box">


            <!-- MODAL HEADER -->

            <div class="modal-header">

                <h2 id="modalTitle">
                    Registration Details
                </h2>

                <button
                    type="button"
                    id="closeModal"
                    class="close-modal"
                    aria-label="Close"
                >
                    ×
                </button>

            </div>


            <!-- MODAL CONTENT -->

            <div id="modalContent">

                <!--
                    JavaScript dynamically inserts
                    registration details here.
                -->

            </div>


        </div>

    </div>


    <!-- =====================================================
         ADMIN DASHBOARD JAVASCRIPT
         ===================================================== -->

    <script src="admin-dashboard.js"></script>

</body>

</html>
