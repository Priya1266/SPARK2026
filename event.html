<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        TechFusion Event
    </title>

    <link
        rel="stylesheet"
        href="event.css"
    >

</head>


<body>


    <!-- =========================================
         BACK BUTTON
         ========================================= -->

    <a
        href="index.html"
        class="back-btn"
    >
        ← Back to TechFusion
    </a>



    <!-- =========================================
         EVENT CONTAINER
         ========================================= -->

    <main class="event-container">


        <!-- =====================================
             EVENT HEADER
             ===================================== -->

        <section class="event-header">

            <h1 id="eventTitle">
                Loading...
            </h1>

            <p id="eventSubtitle">
            </p>

        </section>



        <!-- =====================================
             EVENT DETAILS
             ===================================== -->

        <section class="event-details">


            <!-- ABOUT EVENT -->

            <div class="event-detail">

                <h2>
                    About Event
                </h2>

                <p id="about">
                </p>

            </div>



            <!-- PARTICIPATION -->

            <div class="event-detail">

                <h2>
                    Participation
                </h2>

                <p id="teamSize">
                </p>

            </div>



            <!-- REGISTRATION FEE -->

            <div class="event-detail">

                <h2>
                    Registration Fee
                </h2>

                <p id="fee">
                </p>

            </div>



            <!-- VENUE -->

            <div class="event-detail">

                <h2>
                    Venue
                </h2>

                <p id="venue">
                </p>

            </div>



            <!-- DATE -->

            <div class="event-detail">

                <h2>
                    Date
                </h2>

                <p id="date">
                </p>

            </div>



            <!-- TIME -->

            <div class="event-detail">

                <h2>
                    Time
                </h2>

                <p id="time">
                </p>

            </div>



            <!-- RULES -->

            <div class="event-detail">

                <h2>
                    Rules
                </h2>

                <ul id="rules">
                </ul>

            </div>



            <!-- COORDINATOR -->

<!-- =====================================
     FOCUS AREAS
     ===================================== -->

<div class="event-detail">

    <h2 id="focusTitle">
        Focus Areas
    </h2>

    <ul id="focusAreas">
    </ul>

</div>


<!-- =====================================
     FACULTY COORDINATORS
     ===================================== -->

<div class="event-detail">

    <h2>
        Faculty Coordinators
    </h2>

    <ul id="facultyCoordinators">
    </ul>

</div>


<!-- =====================================
     STUDENT ORGANISERS
     ===================================== -->

<div class="event-detail">

    <h2>
        Student Organisers
    </h2>

    <ul id="studentOrganisers">
    </ul>

</div>


        </section>



        <!-- =====================================
             REGISTER BUTTON
             ===================================== -->

        <section class="register-section">

            <button
                id="registerBtn"
                type="button"
            >
                Register Now →
            </button>

        </section>


    </main>



    <!-- =========================================
         JAVASCRIPT
         ========================================= -->

    <script src="event.js"></script>


</body>

</html>
